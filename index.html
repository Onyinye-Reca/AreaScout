<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e1a36" />
  <title>AreaScout — Find a home with confidence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="rail">
      <a class="brand" href="#home" aria-label="AreaScout home"><span class="brand-mark"><svg viewBox="0 0 32 32"><path d="M16 28s10-9.1 10-17a10 10 0 1 0-20 0c0 7.9 10 17 10 17Z"/><circle cx="16" cy="11" r="3.2"/></svg></span><span>Area<span class="brand-light">Scout</span></span></a>
      <div class="rail-label">DISCOVER</div>
      <nav class="main-nav">
        <button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span>Explore</button>
        <button class="nav-item" data-page="saved"><span class="nav-icon">♡</span>Saved homes <span class="nav-count" id="saved-count">0</span></button>
        <button class="nav-item" data-page="compare"><span class="nav-icon">⇄</span>Compare</button>
        <button class="nav-item" data-page="messages"><span class="nav-icon">▤</span>Messages</button>
      </nav>
      <div class="rail-label second-label">YOUR ACCOUNT</div>
      <nav class="main-nav"><button class="nav-item" data-page="profile"><span class="nav-icon">◉</span>Profile</button></nav>
      <div class="rail-bottom"><div class="help-card"><span class="help-spark">✳</span><strong>Find a place<br>that feels right.</strong><small>Local insight makes all the difference.</small></div><button class="user-card" data-page="profile"><span class="avatar">?</span><span><b>Guest</b><small>Sign in to get started</small></span><span class="dots">···</span></button></div>
    </aside>
    <main class="workspace">
      <header class="topbar"><div class="breadcrumb"><span>AreaScout</span><i>/</i><b id="crumb">Explore</b></div><div class="top-actions"><button class="location-pill" id="location-pill" aria-haspopup="dialog" aria-label="Choose a city"><span class="pin">⌖</span> <span id="city-label">Lagos</span> <span class="chevron">⌄</span></button><button class="icon-button notification" aria-label="Notifications"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><i hidden></i></button><button class="avatar small-avatar" data-page="profile">?</button></div></header>
      <div id="view" class="view"></div>
      <footer class="footer"><span>© 2026 AreaScout</span><span>Local knowledge for your next move <b>·</b> <span id="footer-city">Lagos</span></span><a href="#safety">Safety tips</a></footer>
    </main>
  </div>
  <nav class="mobile-nav"><button class="active" data-page="home"><span>⌂</span>Explore</button><button data-page="saved"><span>♡</span>Saved</button><button data-page="compare"><span>⇄</span>Compare</button><button data-page="profile"><span>◉</span>Profile</button></nav>
  <div id="toast" class="toast" role="status"></div>
  <div id="modal-root"></div>
  <script src="config.js"></script>
  <script src="host.js"></script>
  <script src="admin.js"></script>
  <script src="app.js"></script>
</body>
</html>
